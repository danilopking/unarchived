<style>
:root{
  --bg:#ffffff; --surface:#f8fafd; --surface2:#eef2f8; --line:#dde3ea; --line2:#c4c7c5;
  --text:#1f1f1f; --muted:#5f6368; --accent:#6750a4; --accent-soft:#e9ddff; --on-accent:#ffffff;
  --ss:#e8590c; --ss-soft:#fff1e7; --ig:#0277bd; --ig-soft:#e1f3fc;
  --amber:#8a5a00; --amber-soft:#ffefc2;
  --warn:#b3261e; --warn-soft:#fce8e6; --ok:#146c2e; --ok-soft:#e6f4ea;
  --shadow:0 1px 3px rgba(60,64,67,.25),0 4px 10px rgba(60,64,67,.12);
  --on-pc:#ffffff; --r:12px; color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#1e1f20; --surface:#131314; --surface2:#28292a; --line:#3c4043; --line2:#5f6368;
  --text:#e3e3e3; --muted:#a8acb1; --accent:#d0bcff; --accent-soft:#4f378b; --on-accent:#21005d;
  --ss:#ff8a4c; --ss-soft:#3a2418; --ig:#6cc4f5; --ig-soft:#10303f;
  --amber:#ffd16a; --amber-soft:#3d2f00;
  --warn:#f2b8b5; --warn-soft:#4a1c1a; --ok:#6dd58c; --ok-soft:#173a22;
  --on-pc:#1e1f20; --shadow:0 1px 3px rgba(0,0,0,.6),0 4px 12px rgba(0,0,0,.4); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#1e1f20; --surface:#131314; --surface2:#28292a; --line:#3c4043; --line2:#5f6368;
  --text:#e3e3e3; --muted:#a8acb1; --accent:#d0bcff; --accent-soft:#4f378b; --on-accent:#21005d;
  --ss:#ff8a4c; --ss-soft:#3a2418; --ig:#6cc4f5; --ig-soft:#10303f;
  --amber:#ffd16a; --amber-soft:#3d2f00;
  --warn:#f2b8b5; --warn-soft:#4a1c1a; --ok:#6dd58c; --ok-soft:#173a22;
  --on-pc:#1e1f20; --shadow:0 1px 3px rgba(0,0,0,.6),0 4px 12px rgba(0,0,0,.4); color-scheme:dark; }
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--surface);color:var(--text);
  font:14px/1.45 "Roboto Flex",Roboto,"Segoe UI",system-ui,-apple-system,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;fill:currentColor;flex:none}
.app{display:grid;grid-template-columns:240px 1fr;height:100%}
/* sidebar */
.side{padding:12px 12px 16px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 12px 14px;font-size:18px;font-weight:500;letter-spacing:-.01em}
.brand b{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;background:var(--text);color:var(--bg);font-weight:600;font-size:16px}
.create{display:inline-flex;align-items:center;gap:10px;align-self:flex-start;border:0;border-radius:16px;
  padding:16px 22px 16px 18px;background:var(--bg);box-shadow:var(--shadow);font-weight:500;margin:0 0 6px}
.create:hover{background:var(--surface2)}
.quick{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;align-self:flex-start;margin-bottom:14px;color:var(--muted)}
.quick:hover{background:var(--surface2);color:var(--text)}
.nav{display:flex;align-items:center;gap:14px;height:40px;padding:0 14px;border-radius:999px;border:0;background:transparent;text-align:left;color:var(--text)}
.nav:hover{background:var(--surface2)}
.nav[aria-current="true"]{background:var(--accent-soft);font-weight:500}
.nav .badge{margin-left:auto;min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-size:12px;display:grid;place-items:center;padding:0 6px}
.nav .dot{margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--warn)}
.side-foot{margin-top:auto;padding:12px 14px 0;color:var(--muted);font-size:12px}
/* main */
.main{background:var(--bg);margin:8px 8px 8px 0;border-radius:16px;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.bar{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar h1{font-size:22px;font-weight:400;margin:0 8px 0 4px;white-space:nowrap}
.grow{flex:1}
.content{flex:1;overflow:auto;padding:16px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:transparent;border-radius:999px;padding:7px 16px;font-weight:500;color:var(--text)}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--warn);border-color:transparent}
.btn.danger:hover{background:var(--warn-soft)}
.btn.text{border-color:transparent;color:var(--accent)}
.btn.sm{padding:4px 12px;font-size:13px}
.ibtn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:var(--muted)}
.ibtn:hover{background:var(--surface2);color:var(--text)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 16px;font-weight:500}
.seg button+button{border-left:1px solid var(--line2)}
.seg button[aria-pressed="true"]{background:var(--accent-soft)}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:transparent;border-radius:8px;padding:6px 12px;font-weight:500}
.chip .sw{width:10px;height:10px;border-radius:3px}
.chip[aria-pressed="false"]{opacity:.55}
.chip[aria-pressed="false"] .sw{background:transparent!important;outline:1.5px solid var(--muted)}
.banner{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--r);background:var(--accent-soft);margin-bottom:12px}
.banner.warn{background:var(--warn-soft)}
.empty{color:var(--muted);padding:28px 8px;text-align:center}
/* week */
.norms{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center;color:var(--muted);font-size:13px}
.pill{display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:3px 10px;background:var(--surface2);color:var(--text);font-size:12.5px}
.pill.bad{background:var(--amber-soft);color:var(--amber)}
.pill .pd{width:8px;height:8px;border-radius:50%;flex:none}
.pill.good{background:var(--ok-soft);color:var(--ok)}
.week{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-height:calc(100% - 44px)}
.day{display:flex;flex-direction:column;border-left:1px solid var(--line);min-height:420px;background:var(--bg)}
.day:first-child{border-left:0}
.day.past{background:var(--surface)}
.day.over{background:var(--accent-soft)}
.dayhead{padding:10px 10px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;border-bottom:1px solid var(--line)}
.dayhead .wd{font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.04em}
.dayhead .dn{font-size:24px;width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.dayhead .dn.today{background:var(--accent);color:var(--on-accent)}
.gaps{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;min-height:20px}
.gaps .pill{padding:1px 7px;font-size:11.5px;white-space:nowrap;gap:4px}
.daybody{flex:1;padding:8px;display:flex;flex-direction:column;gap:6px}
.addday{margin:0 8px 8px;border:1px dashed var(--line2);background:transparent;border-radius:8px;padding:6px;color:var(--muted);font-size:13px}
.addday:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.card{border-radius:8px;padding:7px 9px 8px 11px;position:relative;cursor:pointer;border:1px solid transparent;user-select:none}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:8px 0 0 8px;background:var(--pc)}
.card.substack{--pc:var(--ss);background:var(--ss-soft)}
.card.instagram{--pc:var(--ig);background:var(--ig-soft)}
.card:hover{box-shadow:var(--shadow)}
/* status: idea = empty slot, planned = queued in scheduler, published = done */
.card.st-idea{background:transparent;border:1.5px dashed var(--pc)}
.card.st-idea::before{display:none}
.card.st-idea .meta{color:var(--pc)}
.card.st-idea .meta span,.card.st-idea .t,.card.st-idea .rb{color:var(--muted)}
.card.st-idea .t{font-style:italic}
.card.st-planned{border-color:var(--pc)}
.card.st-published{background:var(--pc)}
.card.st-published .meta,.card.st-published .meta span,.card.st-published .t,.card.st-published .rb{color:var(--on-pc)}
.card .sb{display:inline-flex;align-items:center;gap:3px;font-weight:600;white-space:nowrap}
.card .qa{position:absolute;right:5px;bottom:5px;width:24px;height:24px;border-radius:50%;border:1px solid var(--pc);background:var(--bg);color:var(--pc);font-size:12px;line-height:1;padding:0;display:none;place-items:center}
.card:hover .qa,.card:focus-within .qa{display:grid}
.card .qa:hover{background:var(--pc);color:var(--on-pc)}
.legend{display:inline-flex;gap:10px;align-items:center;margin-left:auto;font-size:12px;color:var(--muted)}
.legend b{display:inline-block;width:22px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.legend .lg-idea{border:1.5px dashed var(--muted)}
.legend .lg-planned{background:var(--surface2);border:1px solid var(--muted)}
.legend .lg-published{background:var(--muted)}
.card .meta{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;color:var(--pc);font-weight:600}
.card .meta span{color:var(--muted);font-weight:500}
.card .t{font-size:13px;line-height:1.3;margin-top:2px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .rb{font-size:11.5px;color:var(--muted);margin-top:3px}
.card.dragging{opacity:.35}
/* month */
.month{display:grid;grid-template-columns:repeat(7,minmax(110px,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mh{padding:8px;text-align:center;font-size:11px;font-weight:500;color:var(--muted);border-bottom:1px solid var(--line);letter-spacing:.04em}
.mc{min-height:118px;border-top:1px solid var(--line);border-left:1px solid var(--line);padding:4px 5px 6px;display:flex;flex-direction:column;gap:3px;cursor:pointer}
.mc:nth-child(7n+1){border-left:0}
.mc.out{background:var(--surface)}
.mc.out .mn{color:var(--muted)}
.mc.over{background:var(--accent-soft)}
.mc .mtop{display:flex;align-items:center;justify-content:center;position:relative}
.mn{border:0;background:transparent;width:26px;height:26px;border-radius:50%;font-size:12.5px;font-weight:500}
.mn:hover{background:var(--surface2)}
.mn.today{background:var(--accent);color:var(--on-accent)}
.mc .gapdot{position:absolute;right:2px;width:7px;height:7px;border-radius:50%;background:var(--amber)}
.mi{display:flex;align-items:center;gap:5px;font-size:12px;border-radius:5px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.mi:hover{background:var(--surface2)}
.mi i{width:8px;height:8px;border-radius:50%;flex:none;background:var(--pc)}
.mi.substack{--pc:var(--ss)} .mi.instagram{--pc:var(--ig)}
.mi.substack{--pcs:var(--ss-soft)} .mi.instagram{--pcs:var(--ig-soft)}
.mi.st-idea{color:var(--muted);font-style:italic}
.mi.st-idea i{background:transparent;outline:1.5px dashed var(--pc)}
.mi.st-planned{background:var(--pcs)}
.mi.st-published{background:var(--pc);color:var(--on-pc)}
.mi.st-published i{background:var(--on-pc)}
.more{font-size:12px;color:var(--muted);padding:0 5px}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.32);display:grid;place-items:center;z-index:50;padding:20px}
.dlg{background:var(--bg);border-radius:24px;box-shadow:var(--shadow);width:min(720px,100%);max-height:calc(100% - 20px);display:flex;flex-direction:column;overflow:hidden}
.dlg.small{width:min(460px,100%)}
.dlg header{display:flex;align-items:center;gap:8px;padding:18px 20px 6px 24px}
.dlg header h2{font-size:20px;font-weight:400;margin:0;flex:1}
.dlg .body{padding:8px 24px 16px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.dlg footer{display:flex;gap:8px;padding:12px 20px 18px;border-top:1px solid var(--line);align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:5px}
.field>span{font-size:12.5px;color:var(--muted);font-weight:500}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>.field{flex:1;min-width:140px}
.inp{border:1px solid var(--line2);border-radius:8px;padding:9px 11px;background:var(--bg);width:100%}
.inp:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
textarea.inp{resize:vertical;min-height:120px;line-height:1.5}
.title-inp{font-size:20px;border:0;border-bottom:1px solid var(--line2);border-radius:0;padding:8px 2px}
.title-inp:focus{outline:0;border-bottom:2px solid var(--accent)}
.platseg button[data-v="substack"][aria-pressed="true"]{background:var(--ss-soft);color:var(--ss)}
.platseg button[data-v="instagram"][aria-pressed="true"]{background:var(--ig-soft);color:var(--ig)}
.textwrap{position:relative}
.textwrap .copy{position:absolute;right:6px;top:6px}
.media{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.thumb{position:relative;width:112px;height:112px;border-radius:10px;overflow:hidden;background:var(--surface2);display:grid;place-items:center;text-align:center;font-size:11.5px;color:var(--muted);border:1px solid var(--line)}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.thumb a{color:inherit;padding:6px;overflow-wrap:anywhere;text-decoration:none}
.thumb .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;padding:0}
.thumb .x svg{width:16px;height:16px}
.thumb .play{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:28px;text-shadow:0 1px 4px rgba(0,0,0,.6);pointer-events:none}
.side-foot a{color:inherit}
.thumb .open{position:absolute;left:4px;bottom:4px;font-size:11px;background:rgba(0,0,0,.6);color:#fff;border-radius:6px;padding:1px 6px}
.drop{width:112px;height:112px;border:1px dashed var(--line2);border-radius:10px;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:12.5px;cursor:pointer;padding:8px;background:transparent}
.drop:hover,.drop.over{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.hint{font-size:12px;color:var(--muted)}
/* ideas */
.ideas{display:grid;grid-template-columns:260px 1fr;gap:16px;min-height:100%}
.tree{border-right:1px solid var(--line);padding-right:12px;display:flex;flex-direction:column;gap:2px}
.fold{display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:999px;padding:7px 12px;text-align:left;width:100%}
.fold:hover{background:var(--surface2)}
.fold[aria-current="true"]{background:var(--accent-soft);font-weight:500}
.fold.sub{padding-left:36px}
.fold .n{margin-left:auto;font-size:12px;color:var(--muted)}
.fold svg{width:18px;height:18px;color:var(--muted)}
.capture{display:flex;gap:8px;align-items:flex-start;margin-bottom:14px}
.capture textarea{min-height:44px;height:44px}
.ilist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.icard{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;background:var(--bg);display:flex;flex-direction:column;gap:6px;text-align:left}
.icard:hover{box-shadow:var(--shadow)}
.icard h3{margin:0;font-size:14.5px;font-weight:500}
.icard p{margin:0;color:var(--muted);font-size:13px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.icard .im{display:flex;gap:4px}
.icard .im img{width:44px;height:44px;object-fit:cover;border-radius:6px}
.icard small{color:var(--muted);font-size:11.5px}
.fhead{display:flex;align-items:center;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.fhead h2{font-size:20px;font-weight:400;margin:0 8px 0 0}
/* generic panels */
.panel{border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:16px;background:var(--bg)}
.panel h2{font-size:16px;font-weight:500;margin:0 0 12px}
.panel h3{font-size:13px;font-weight:500;color:var(--muted);margin:14px 0 6px}
.lrow{display:flex;gap:8px;align-items:center;padding:4px 0}
.lrow .inp{padding:6px 10px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.task{display:flex;align-items:center;gap:12px;padding:8px 4px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.task .tt{flex:1}
.task .rep{font-size:12px;color:var(--muted)}
.wdpick{display:flex;gap:4px}
.wdpick button{width:34px;height:30px;border-radius:8px;border:1px solid var(--line2);background:transparent;font-size:12px}
.wdpick button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.tags textarea{min-height:90px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:16px}
.tile{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile .k{font-size:12.5px;color:var(--muted)}
.tile .v{font-size:26px;font-weight:400;margin:2px 0}
.tile .d{font-size:12.5px}
.tile .d.up{color:var(--ok)} .tile .d.down{color:var(--warn)}
.tile svg{width:100%;height:34px;display:block;margin-top:6px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{font-weight:500;color:var(--muted)}
.scroll-x{overflow-x:auto}
.toggle{display:inline-flex;align-items:center;gap:10px;cursor:pointer}
.toggle input{width:36px;height:20px;accent-color:var(--accent)}
.num{width:72px}
/* plan */
button.pill{border:0;cursor:pointer;font:inherit}
button.pill:hover{filter:brightness(.96)}
.pill.soft{background:transparent;outline:1px dashed var(--amber);color:var(--amber)}
.ptbl td,.ptbl th{text-align:center}
.ptbl th.today{color:var(--accent)}
.ptbl td.k{text-align:left;white-space:nowrap}
.ptbl td.k i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:1px}
.ptbl small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.cnt{display:inline-flex;align-items:center;gap:4px}
.cnt button{width:24px;height:24px;border-radius:50%;border:1px solid var(--line2);background:transparent;padding:0;line-height:1;font-size:14px;display:grid;place-items:center}
.cnt button:hover{background:var(--surface2)}
.sumrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sumrow:last-child{border-bottom:0}
.sumrow .nm{flex:1;min-width:160px;font-weight:500}
.sumrow .nm i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:1px}
.sumrow .bar2{flex:2;min-width:140px;height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;position:relative}
.sumrow .bar2 b{position:absolute;left:0;top:0;bottom:0;background:var(--accent-soft)}
.sumrow .bar2 em{position:absolute;left:0;top:0;bottom:0;background:var(--ok)}
.sumrow .fig{font-size:13px;color:var(--muted);min-width:170px;text-align:right}
.tgt{flex-wrap:wrap}
.lrow.tgt .inp{width:auto}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#303030;color:#f2f2f2;padding:12px 18px;border-radius:8px;z-index:80;box-shadow:var(--shadow);max-width:90vw}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{flex-direction:row;flex-wrap:wrap;align-items:center;padding:8px}
  .brand,.side-foot{display:none}
  .create,.quick{margin:0}
  .main{margin:0 8px 8px}
  .ideas{grid-template-columns:1fr}
  .tree{border-right:0;padding:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== redesign: soft dashboard, near-white background with hairline rings ===== */
:root{--bg:#ffffff;--surface:#fafafa;--surface2:#f4f5f7;--line:#ececef;--line2:#dfe2e7;--text:#151a24;--muted:#8a909c;
 --accent:#151a24;--accent-soft:#ffffff;--on-accent:#ffffff;--ss:#f26b21;--ss-soft:#fff1e8;--ig:#3b7be0;--ig-soft:#eaf1fc;
 --amber:#9a6b00;--amber-soft:#fdf3d4;--ok:#2f8f5b;--ok-soft:#e6f4ec;--on-pc:#ffffff;--r:20px;--ring:0 0 0 1px #ececef;--shadow:0 0 0 1px #ececef}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#1f2228;--surface:#16181d;--surface2:#262a32;--line:#2b2f37;--line2:#363b45;--text:#eef0f4;--muted:#8d93a0;
 --accent:#eef0f4;--accent-soft:#1f2228;--on-accent:#16181d;--ss:#ff8a4c;--ss-soft:#3a2416;--ig:#6aa7ff;--ig-soft:#16263f;
 --amber:#ffd36b;--amber-soft:#3a2e0e;--ok:#5ed38f;--ok-soft:#123222;--on-pc:#16181d;--ring:0 0 0 1px #2b2f37;--shadow:0 0 0 1px #2b2f37}}
:root[data-theme="dark"]{--bg:#1f2228;--surface:#16181d;--surface2:#262a32;--line:#2b2f37;--line2:#363b45;--text:#eef0f4;--muted:#8d93a0;
 --accent:#eef0f4;--accent-soft:#1f2228;--on-accent:#16181d;--ss:#ff8a4c;--ss-soft:#3a2416;--ig:#6aa7ff;--ig-soft:#16263f;
 --amber:#ffd36b;--amber-soft:#3a2e0e;--ok:#5ed38f;--ok-soft:#123222;--on-pc:#16181d;--ring:0 0 0 1px #2b2f37;--shadow:0 0 0 1px #2b2f37}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;letter-spacing:-.01em;background:var(--surface)}
.app{grid-template-columns:236px 1fr}
.side{background:transparent;padding:22px 16px;gap:2px}
.brand{font-size:15px;font-weight:600;padding:0 8px 22px}
.brand b{background:var(--ss);color:#fff;border-radius:50%;width:28px;height:28px;font-size:13px}
.create{width:100%;justify-content:center;border-radius:999px;background:var(--accent);color:var(--on-accent);box-shadow:none;padding:11px;font-weight:500}
.create:hover{background:var(--accent);opacity:.9}
.quick{width:100%;justify-content:center;border-radius:999px;border:0;background:var(--bg);box-shadow:var(--ring);color:var(--text);margin:6px 0 18px}
.quick:hover{background:var(--bg);color:var(--text)}
#nav::before{content:"Работа";display:block;font-size:12px;color:var(--muted);padding:0 12px 6px}
.side .nav{height:36px;border-radius:12px;padding:0 12px;gap:10px;color:var(--muted);font-size:13px}
.side .nav:hover{background:var(--surface2);color:var(--text)}
.side .nav svg.i{width:17px;height:17px}
.nav[aria-current="true"]{background:var(--bg);color:var(--text);font-weight:600;box-shadow:var(--ring)}
.nav .badge{background:var(--surface2);color:var(--text);font-size:11px}
.side-foot{font-size:11px;color:var(--muted)}.side-foot a{color:inherit}
.main{background:transparent;margin:14px 14px 14px 0;border-radius:0}
.bar{border:0;padding:6px 6px 14px;gap:8px}
.bar h1{font-size:30px;font-weight:300;letter-spacing:-.035em;margin-right:10px}
.bar h1 .sub{font-size:15px;color:var(--muted);letter-spacing:0;font-weight:400;margin-left:8px}
.btn{border:0;background:var(--bg);box-shadow:var(--ring);border-radius:999px;padding:8px 16px;font-weight:500}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--on-accent);box-shadow:none}
.btn.danger,.btn.text{box-shadow:none;background:transparent}
.btn.sm{padding:5px 12px}
.ibtn{background:var(--bg);box-shadow:var(--ring);width:34px;height:34px}
.dlg .ibtn,.panel .ibtn,.thumb .ibtn{box-shadow:none;background:transparent}
.chip{border:0;background:var(--bg);box-shadow:var(--ring);border-radius:999px;padding:7px 14px;font-weight:500}
.chip .sw{border-radius:50%}
.seg{border:0;background:var(--bg);box-shadow:var(--ring);border-radius:999px;padding:3px}
.seg button{border:0!important;border-radius:999px;padding:6px 16px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.platseg button[aria-pressed="true"]{color:#fff!important}
.platseg button[data-v="substack"][aria-pressed="true"]{background:var(--ss)!important}
.platseg button[data-v="instagram"][aria-pressed="true"]{background:var(--ig)!important}
.content{padding:0 6px 6px}
.banner{border-radius:16px;box-shadow:var(--ring);background:var(--bg)}
/* KPI tiles */
.tiles5{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--bg);border:0;border-radius:20px;box-shadow:var(--ring);padding:14px 16px;display:flex;flex-direction:column;gap:6px;text-align:left;color:var(--text)}
button.kpi:hover{box-shadow:0 0 0 1px var(--line2)}
.kpi .l{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}
.kpi .pd{width:8px;height:8px;border-radius:50%;flex:none}
.kpi .v{font-size:30px;font-weight:300;letter-spacing:-.04em;line-height:1}
.kpi .v small{font-size:15px;color:var(--muted);font-weight:400;letter-spacing:0}
.kpi .s{align-self:flex-start;font-size:11px;font-weight:500;border-radius:999px;padding:2px 8px;background:var(--amber-soft);color:var(--amber)}
.kpi .s.ok{background:var(--ok-soft);color:var(--ok)}
.kpi.legendk{justify-content:center}
.kpi.legendk .legend{flex-direction:column;align-items:flex-start;gap:6px;margin:0}
.norms{background:var(--bg);box-shadow:var(--ring);border-radius:16px;padding:10px 14px}
/* week */
.week{background:var(--bg);border:0;border-radius:24px;box-shadow:var(--ring);padding:8px;min-height:calc(100% - 140px)}
.day{border:0!important;background:transparent!important}
.day+.day{border-left:1px solid var(--line)!important}
.day.past{background:transparent!important}
.day.over{background:var(--surface2)!important;border-radius:14px}
.dayhead{border:0;align-items:flex-start;padding:12px 10px 10px}
.dayhead .wd{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.dayhead .dn{width:auto;height:auto;font-size:30px;font-weight:300;letter-spacing:-.04em;border-radius:0}
.dayhead .dn.today{background:var(--accent);color:var(--on-accent);border-radius:14px;padding:2px 10px}
.gaps{justify-content:flex-start}
.gaps .pill{background:var(--surface2);color:var(--muted)}
.gaps .pill.bad{background:var(--amber-soft);color:var(--amber)}
.gaps .pill.good{background:var(--ok-soft);color:var(--ok)}
.daybody{padding:4px 6px;gap:6px}
.card{border-radius:14px;padding:9px 11px;border:1px solid var(--line2);background:var(--bg)!important}
.card::before{display:none}
.card .meta{align-items:center;gap:6px;justify-content:flex-start;color:var(--pc)}
.card .meta::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--pc);flex:none}
.card .meta .sb{margin-left:auto}
.card .t{font-size:12.5px;font-weight:500}
.card.substack.st-planned{background:var(--ss-soft)!important;border-color:transparent}
.card.instagram.st-planned{background:var(--ig-soft)!important;border-color:transparent}
.card.st-idea{border:1.5px dashed color-mix(in srgb,var(--pc) 55%,transparent);background:transparent!important}
.card.st-published{background:var(--pc)!important;border-color:transparent}
.card.st-published .meta::before{background:var(--on-pc)}
.card:hover{box-shadow:0 4px 14px rgba(21,26,36,.08)}
.addday{border:0;border-radius:12px;background:var(--surface2);color:var(--muted);margin:6px}
.addday:hover{background:var(--surface2);color:var(--text)}
.pill{border-radius:999px}
/* month */
.month{background:var(--bg);border:0;border-radius:24px;box-shadow:var(--ring);overflow:hidden}
.mc{border-color:var(--line)}
.mc.out{background:var(--surface)}
.mn.today{background:var(--accent);color:var(--on-accent)}
.mi{border-radius:7px}
/* panels, lists, editors */
.panel{border:0;border-radius:20px;box-shadow:var(--ring);background:var(--bg);padding:18px 20px}
.panel h2{font-size:17px;font-weight:500;letter-spacing:-.02em}
.tile{border:0;border-radius:20px;box-shadow:var(--ring);background:var(--bg)}
.tile .v{font-weight:300;letter-spacing:-.04em;font-size:30px}
.ideas .tree{border:0;background:var(--bg);box-shadow:var(--ring);border-radius:20px;padding:10px}
.fold{border-radius:12px}
.fold[aria-current="true"]{background:var(--surface2)}
.icard{border:0;border-radius:18px;box-shadow:var(--ring);background:var(--bg)}
.icard:hover{box-shadow:0 0 0 1px var(--line2),0 6px 18px rgba(21,26,36,.06)}
.inp{border-radius:10px;border-color:var(--line2);background:var(--bg)}
.inp:focus{outline:2px solid var(--accent)}
.title-inp{border-radius:0}
.title-inp:focus{outline:0;border-bottom:2px solid var(--accent)}
.dlg{border-radius:24px;box-shadow:0 0 0 1px var(--line),0 24px 60px rgba(21,26,36,.18)}
.dlg header h2{font-size:22px;font-weight:300;letter-spacing:-.03em}
.dlg footer{border-color:var(--line)}
.thumb,.drop{border-radius:14px}
.toast{border-radius:999px;background:var(--accent);color:var(--on-accent)}
.task{border-color:var(--line)}
.tbl th,.tbl td{border-color:var(--line)}
@media (max-width:900px){.main{margin:0 8px 8px}.side{padding:8px}#nav::before{display:none}}

/* used ideas: very pale, at the end of the list */
.icard{position:relative}
.icard .usebtn{position:absolute;top:8px;right:8px;border:0;border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:500;background:var(--surface2);color:var(--muted);opacity:0;transition:opacity .12s}
.icard:hover .usebtn,.icard:focus-within .usebtn{opacity:1}
.icard .usebtn:hover{background:var(--accent);color:var(--on-accent)}
.icard.used{opacity:.32;box-shadow:0 0 0 1px var(--line);background:transparent}
.icard.used:hover{opacity:.7}
.icard.used h3{text-decoration:line-through;text-decoration-thickness:1px}
[hidden]{display:none!important}

/* login */
#login{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--surface);padding:20px}
#login[hidden]{display:none}
body.locked .app{filter:blur(6px);pointer-events:none}
.loginbox{width:min(380px,100%);background:var(--bg);border-radius:24px;box-shadow:var(--ring),0 20px 50px rgba(21,26,36,.08);padding:28px;display:flex;flex-direction:column;gap:14px}
.loginbox .brand{padding:0 0 6px}
.loginbox h2{margin:0;font-size:26px;font-weight:300;letter-spacing:-.03em}
.loginbox p{margin:0}
.loginbox .btn{justify-content:center;padding:11px}
.lerr{color:var(--warn);font-size:12.5px;min-height:16px}
.linkbtn{border:0;background:none;padding:0;color:inherit;text-decoration:underline;cursor:pointer;font-size:inherit}
.urow{border-bottom:1px solid var(--line);padding:8px 0}

/* results */
h2.grp{font-size:17px;font-weight:500;letter-spacing:-.02em;margin:18px 4px 10px;display:flex;align-items:center;gap:8px}
h2.grp:first-child{margin-top:4px}
.mgrid+.panel{margin-top:16px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.mcard{background:var(--bg);border-radius:20px;box-shadow:var(--ring);padding:14px 16px 8px;display:flex;flex-direction:column;gap:4px;min-width:0}
.mcard .mhd{display:flex;align-items:center;gap:8px}
.mcard .mhd .n{font-size:14px;font-weight:500}
.mcard .mhd .n::first-letter{text-transform:uppercase}
.mcard .pd,.panel .pd,h2.grp .pd,.field .pd{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.mv{font-size:34px;font-weight:300;letter-spacing:-.04em;line-height:1.1;display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}
.mv small{font-size:18px;color:var(--muted)}
.mv .mw{font-size:12px;color:var(--muted);letter-spacing:0;margin-left:auto}
.mds{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px}
.dl{color:var(--muted)}.dl em{font-style:normal;color:var(--muted)}
.dl.up{color:var(--ok)}.dl.down{color:var(--warn)}
svg.lc{width:100%;height:auto;display:block;margin-top:4px;overflow:visible}
svg.lc .gl{stroke:var(--line);stroke-width:1}
svg.lc .gl0{stroke:var(--line2);stroke-width:1}
svg.lc .ax{fill:var(--muted);font-size:10.5px}
svg.lc .lv{fill:var(--text);font-size:11.5px;font-weight:600}
svg.lc .hit{fill:transparent;cursor:default}
#ctip{position:fixed;z-index:90;background:var(--accent);color:var(--on-accent);font-size:12px;padding:5px 9px;border-radius:8px;pointer-events:none;white-space:nowrap}
#ctip[hidden]{display:none}
.tbl small{display:block;font-size:10.5px}.tbl small.up{color:var(--ok)}.tbl small.down{color:var(--warn)}
.tbl tr.miss td{color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><b>U</b>Контент-план</div>
    <button class="create" data-act="new"><svg class="i" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>Создать</button>
    <button class="quick" data-act="quickidea"><svg class="i" viewBox="0 0 24 24"><path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7z"/></svg>Быстрая идея</button>
    <nav id="nav" style="display:contents"></nav>
    <div class="side-foot" id="foot"></div>
  </aside>
  <main class="main">
    <div class="bar" id="bar"></div>
    <div class="content" id="content"><div class="empty">Загрузка…</div></div>
  </main>
</div>
<div id="modal"></div>
<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const IC={
  cal:'M19 4h-1V2h-2v2H8V2H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11z',
  idea:'M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7z',
  task:'M19 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.11 0 2-.9 2-2V5c0-1.1-.89-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z',
  tag:'M20 10V8h-4V4h-2v4h-4V4H8v4H4v2h4v4H4v2h4v4h2v-4h4v4h2v-4h4v-2h-4v-4h4zm-6 4h-4v-4h4v4z',
  chart:'M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z',
  tune:'M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z',
  left:'M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z', right:'M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z',
  close:'M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z',
  del:'M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z',
  copy:'M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z',
  folder:'M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z',
  plus:'M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z',
  flag:'M14.4 6 14 4H5v17h2v-7h5.6l.4 2h7V6z'
};
const ic=(k,cls)=>`<svg class="i${cls?' '+cls:''}" viewBox="0 0 24 24" aria-hidden="true"><path d="${IC[k]}"/></svg>`;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x};
const today=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
const wdIdx=d=>(d.getDay()+6)%7;
const mondayOf=d=>addDays(d,-wdIdx(d));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const MG=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const WD=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const WDF=['понедельник','вторник','среда','четверг','пятница','суббота','воскресенье'];
const PLAT={substack:'Substack',instagram:'Instagram'};
const STATUS=[['idea','Идея — пустой слот'],['planned','Запланировано — в отложке'],['published','Опубликовано — вышло']];
const shortDate=s=>{const d=parse(s);return `${d.getDate()} ${MG[d.getMonth()]}`};

const DEFAULTS={
  rubrics:[],
  formats:[
    {id:'letter',name:'Письмо',platform:'substack'},
    {id:'note',name:'Note',platform:'substack'},
    {id:'reel',name:'Reel',platform:'instagram'},
    {id:'carousel',name:'Карусель',platform:'instagram'},
    {id:'post',name:'Пост',platform:'instagram'},
    {id:'stories',name:'Stories',platform:'instagram'}
  ],
  norms:{enabled:true,notesMin:3,notesMax:4,reelsMin:5,reelsMax:7,carMin:2,carMax:3,stories:true},
  metrics:[
    {id:'ss_free',name:'Substack: бесплатные подписчики'},
    {id:'ss_followers',name:'Substack: фолловеры'},
    {id:'ss_paid',name:'Substack: платные подписчики'},
    {id:'ss_open',name:'Substack: открываемость, %'},
    {id:'ig_followers',name:'Instagram: подписчики'},
    {id:'ss_reach',name:'Substack: охват за месяц'},
    {id:'ig_reach',name:'Instagram: охват за неделю'}
  ],
  reminderDay:5,
  plan:{enabled:true,
    counters:[{id:'comments',name:'Комментарии',platform:'substack'}],
    targets:[
      {id:'t_reel',format:'reel',period:'week',min:3},
      {id:'t_car',format:'carousel',period:'week',min:1,withFirst:'reel'},
      {id:'t_note',format:'note',period:'day',min:4},
      {id:'t_com',counter:'comments',period:'day',min:10}
    ]}
};

/* ---------- state ---------- */
const hashView=()=>{const h=location.hash.slice(1);return ['planner','ideas','tags','results','lists'].includes(h)?h:'planner'};
const S={db:null,assets:null,ok:false,loaded:false,stale:false,
  items:[],ideas:[],folders:[],tasks:[],tags:[],metrics:[],daily:[],cntLocal:{},planAnchor:today(),settingsDoc:null,
  view:hashView(),mode:'week',anchor:today(),show:{substack:true,instagram:true},
  folder:null,resWeek:iso(mondayOf(today())),pending:false};
const settings=()=>{const s=S.settingsDoc||{};return {
  rubrics:Array.isArray(s.rubrics)?s.rubrics:DEFAULTS.rubrics,
  formats:Array.isArray(s.formats)?s.formats:DEFAULTS.formats,
  norms:Object.assign({},DEFAULTS.norms,s.norms||{}),
  metrics:Array.isArray(s.metrics)?s.metrics:DEFAULTS.metrics,
  reminderDay:typeof s.reminderDay==='number'?s.reminderDay:DEFAULTS.reminderDay,
  plan:s.plan&&Array.isArray(s.plan.targets)?{enabled:s.plan.enabled!==false,targets:s.plan.targets,counters:Array.isArray(s.plan.counters)?s.plan.counters:[]}:JSON.parse(JSON.stringify(DEFAULTS.plan))};};
const fmtName=id=>(settings().formats.find(f=>f.id===id)||{}).name||'';
const rubName=id=>(settings().rubrics.find(r=>r.id===id)||{}).name||'';

/* ---------- ui primitives ---------- */
let toastT;
function toast(msg){let t=document.querySelector('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=msg;clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),3200)}
function errMsg(e){const c=e&&e.code;
  if(c==='invalid_argument')return 'Нет прав на изменение или неверные данные.';
  if(c==='quota_exceeded')return 'Хранилище заполнено: удалите старые записи.';
  if(c==='resource_exhausted'||c==='rate_limited')return 'Слишком много действий подряд, попробуйте через минуту.';
  if(c==='too_large')return 'Запись или файл слишком большие.';
  if(c==='denied')return 'Нет доступа к таблице или папке. Попросите владельца открыть доступ.';
  if(c==='unsupported_type')return 'Этот тип файла не поддерживается.';
  if(c==='revoked')return 'Доступ к данным закрыт.';
  return 'Не удалось сохранить. Проверьте соединение и повторите.';}
async function W(p){try{await p;return true}catch(e){console.error(e);toast(errMsg(e));return false}}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);toast('Скопировано');return}catch(e){}
  const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast('Скопировано')}catch(e){toast('Не удалось скопировать')}ta.remove();}

let modalStack=null;
function openModal(html,cls){document.getElementById('modal').innerHTML=`<div class="scrim" data-scrim><div class="dlg ${cls||''}" role="dialog" aria-modal="true">${html}</div></div>`;
  const f=document.querySelector('#modal [autofocus]');if(f)setTimeout(()=>f.focus(),20);}
function closeModal(){document.getElementById('modal').innerHTML='';if(S.pending){S.pending=false;render()}}
function confirmDlg(text,okLabel){return new Promise(res=>{
  openModal(`<header><h2>${esc(text)}</h2></header><footer><span class="grow"></span><button class="btn" data-c="0">Отмена</button><button class="btn primary" data-c="1" autofocus>${esc(okLabel||'Удалить')}</button></footer>`,'small');
  document.querySelectorAll('#modal [data-c]').forEach(b=>b.onclick=()=>{const v=b.dataset.c==='1';closeModal();res(v)});});}
function promptDlg(title,value,okLabel){return new Promise(res=>{
  openModal(`<header><h2>${esc(title)}</h2></header><div class="body"><input class="inp" id="pv" value="${esc(value||'')}" autofocus></div><footer><span class="grow"></span><button class="btn" data-c="0">Отмена</button><button class="btn primary" data-c="1">${esc(okLabel||'Сохранить')}</button></footer>`,'small');
  const inp=document.getElementById('pv');
  const done=v=>{const val=inp.value.trim();closeModal();res(v&&val?val:null)};
  inp.onkeydown=e=>{if(e.key==='Enter')done(true)};
  document.querySelectorAll('#modal [data-c]').forEach(b=>b.onclick=()=>done(b.dataset.c==='1'));});}

/* ---------- media ---------- */
function isReferenced(mid,except){
  const used=x=>x.id!==except&&Array.isArray(x.media)&&x.media.some(m=>m.id===mid);
  return S.items.some(used)||S.ideas.some(used);}
async function dropAssets(ids,except){for(const id of ids){if(isReferenced(id,except))continue;try{await S.assets.delete(id)}catch(e){console.warn(e)}}}
const thumbUrl=id=>`https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w400`;
const openUrl=id=>`https://drive.google.com/file/d/${encodeURIComponent(id)}/view`;
function mediaThumbs(list,editable){
  return list.map(m=>{const ct=m.ct||'';const open=openUrl(m.id);let inner;
    if(ct.startsWith('image/')||ct.startsWith('video/'))inner=`<img src="${thumbUrl(m.id)}" alt="${esc(m.name)}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:${esc(JSON.stringify(m.name||'файл'))},style:'padding:6px'}))">${ct.startsWith('video/')?'<span class="play">▶</span>':''}`;
    else inner=`<a href="${open}" target="_blank" rel="noopener">${esc(m.name||'Файл')}</a>`;
    return `<div class="thumb">${inner}<a class="open" href="${open}" target="_blank" rel="noopener">открыть</a>${editable?`<button class="x" data-act="rmmedia" data-mid="${esc(m.id)}" aria-label="Убрать файл">${ic('close')}</button>`:''}</div>`;}).join('');}
function mediaBlock(list){
  return `<div class="field"><span>Медиа</span><div class="media" id="media">${mediaThumbs(list,true)}<label class="drop" id="dropzone">Добавить файлы<br>или перетащить сюда<input type="file" id="fileinp" multiple hidden accept="image/*,video/*,audio/*,application/pdf"></label></div>
  <div class="lrow"><input class="inp" id="drivelink" placeholder="Или вставьте ссылку на файл с Google Drive"><button type="button" class="btn sm" data-act="drivelink">Добавить</button></div>
  <div class="hint">Файлы попадают в папку «Медиа» на Google Drive. Загрузка отсюда — до ${MAXMB} МБ; большое видео положите в папку сами и вставьте ссылку.</div></div>`;}
async function uploadFiles(files){
  if(!ED)return;
  for(const f of files){
    const name=f.name||'файл';
    if(f.size>MAXMB*1024*1024){toast(`«${name}» больше ${MAXMB} МБ: положите его в папку «Медиа» на Drive и вставьте ссылку.`);continue}
    toast(`Загружаю «${name}»…`);
    try{const r=await S.assets.upload(f);
      if(!ED)return;
      ED.draft.media.push({id:r.id,ct:r.contentType,name:r.name||name});ED.uploads.push(r.id);
      syncFields();refreshMedia();toast('Файл добавлен');
    }catch(e){console.error(e);toast(errMsg(e))}}}
function refreshMedia(){const box=document.getElementById('media');if(!box)return;
  const drop=document.getElementById('dropzone');box.innerHTML=mediaThumbs(ED.draft.media,true);if(drop)box.appendChild(drop);}

/* ---------- editors ---------- */
let ED=null;
function syncFields(){if(!ED)return;document.querySelectorAll('#modal [data-f]').forEach(el=>{ED.draft[el.dataset.f]=el.value})}
function defPlat(){return S.show.substack||!S.show.instagram?'substack':'instagram'}

  if(!d.format||!st.formats.some(f=>f.id===d.format&&f.platform===d.platform))d.format=(st.formats.find(f=>f.platform===d.platform)||{}).id||'';

      <label class="field"><span>Дата</span><input class="inp" type="date" data-f="date" value="${esc(d.date)}"></label>

    </div>

    <label class="field"><span>Ссылка (необязательно)</span><input class="inp" type="url" data-f="link" value="${esc(d.link)}" placeholder="https://"></label>
    ${mediaBlock(d.media)}
  </div>
  <footer>${ED.id?`<button class="btn danger" data-act="itemdel">${ic('del')}Удалить</button><button class="btn text" data-act="itemdup">Дублировать</button>`:''}<span class="grow"></span><button class="btn" data-act="edclose">Отмена</button><button class="btn primary" data-act="itemsave">Сохранить</button></footer>`);

function wireDrop(){const z=document.getElementById('dropzone');if(!z)return;
  z.ondragover=e=>{e.preventDefault();z.classList.add('over')};z.ondragleave=()=>z.classList.remove('over');
  z.ondrop=e=>{e.preventDefault();z.classList.remove('over');uploadFiles([...e.dataTransfer.files])};
  document.getElementById('fileinp').onchange=e=>{uploadFiles([...e.target.files]);e.target.value=''};}
async function saveItem(){
  syncFields();const d=ED.draft;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d.date)){toast('Укажите дату.');return}
  const data={platform:d.platform,format:d.format||'',rubricId:d.rubricId||'',title:(d.title||'').trim(),date:d.date,time:d.time||'',status:d.status||'planned',text:d.text||'',link:(d.link||'').trim(),media:d.media,updatedAt:Date.now()};
  let ok;
  if(ED.id){const prev=S.items.find(x=>x.id===ED.id);data.createdAt=(prev&&prev.createdAt)||Date.now();ok=await W(S.db.doc('items/'+ED.id).set(data))}
  else{data.createdAt=Date.now();ok=await W(S.db.collection('items').add(data))}
  if(!ok)return;
  const rm=ED.removed,id=ED.id;ED=null;closeModal();await dropAssets(rm,id);}
async function closeEditor(){const up=ED?ED.uploads.slice():[];ED=null;closeModal();
  if(up.length)await dropAssets(up,null);}

  const d=it?JSON.parse(JSON.stringify(it)):{title:'',text:'',folderId:folderId||S.folder||'',media:[]};
  delete d.id;if(!Array.isArray(d.media))d.media=[];
  ED={kind:'idea',id:id||null,draft:d,uploads:[],removed:[]};renderIdeaEditor();}
function folderOptions(sel){return sortedFolders().map(f=>`<option value="${esc(f.id)}"${f.id===sel?' selected':''}>${f.parent?'— ':''}${esc(f.name)}</option>`).join('')}
function renderIdeaEditor(){const d=ED.draft;
  openModal(`<header><h2>${ED.id?'Запись':'Новая запись'}</h2><button class="ibtn" data-act="edclose" aria-label="Закрыть">${ic('close')}</button></header>

async function saveIdea(stay){
  syncFields();const d=ED.draft;
  if(!d.title.trim()&&!d.text.trim()&&!d.media.length){toast('Запись пустая.');return null}
  if(!d.folderId){toast('Сначала создайте папку.');return null}
  const data={title:d.title.trim(),text:d.text,folderId:d.folderId,media:d.media,used:!!d.used,usedAt:d.usedAt||null,updatedAt:Date.now()};
  let id=ED.id,ok;
  if(id){const prev=S.ideas.find(x=>x.id===id);data.createdAt=(prev&&prev.createdAt)||Date.now();ok=await W(S.db.doc('ideas/'+id).set(data))}
  else{data.createdAt=Date.now();const ref=S.db.collection('ideas').doc();id=ref.id;ok=await W(ref.set(data))}
  if(!ok)return null;
  const rm=ED.removed;ED=null;if(!stay)closeModal();await dropAssets(rm,id);return {id,data};}

/* ---------- folders ---------- */
function sortedFolders(){
  const all=S.folders.slice().sort((a,b)=>(a.order||0)-(b.order||0)||a.name.localeCompare(b.name,'ru'));
  const out=[];all.filter(f=>!f.parent).forEach(r=>{out.push(r);all.filter(c=>c.parent===r.id).forEach(c=>out.push(c))});return out;}

/* ---------- tasks ---------- */
function taskToday(t,d){const ds=iso(d);
  if(t.kind==='daily')return true;
  if(t.kind==='weekly')return Array.isArray(t.weekdays)&&t.weekdays.includes(wdIdx(d));
  return !t.done&&(!t.due||t.due<=ds);}
function taskDoneToday(t){return t.kind==='once'?!!t.done:Array.isArray(t.doneDates)&&t.doneDates.includes(iso(today()))}
function openTodayCount(){return 0}

/* ---------- norms & metrics ---------- */
const fmtExists=id=>settings().formats.some(f=>f.id===id);
/* plan: targets per format or counter, per day or week */
const cntDef=id=>settings().plan.counters.find(c=>c.id===id);
function tgtPlat(t){if(t.counter){const c=cntDef(t.counter);return c?c.platform:''}const f=settings().formats.find(x=>x.id===t.format);return f?f.platform:''}
function tgtName(t){if(t.counter){const c=cntDef(t.counter);return c?c.name:'?'}return fmtName(t.format)||'?'}
function tgtValid(t){return t.counter?!!cntDef(t.counter):fmtExists(t.format)}
function planTargets(){return settings().plan.targets.filter(tgtValid)}
function cntVal(cid,ds){const k=ds+'|'+cid;if(k in S.cntLocal)return S.cntLocal[k];const d=S.daily.find(x=>x.id===ds);return (d&&d.counts&&d.counts[cid])||0}
/* planned = planned or published; done = published (counters: the count itself) */
function fmtCount(fmt,from,to,doneOnly){return S.items.filter(i=>i.format===fmt&&i.date>=from&&i.date<=to&&(doneOnly?i.status==='published':i.status!=='idea')).length}
function tgtCount(t,from,to,doneOnly){if(t.counter){let s=0;for(let d=parse(from);iso(d)<=to;d=addDays(d,1))s+=cntVal(t.counter,iso(d));return s}return fmtCount(t.format,from,to,doneOnly)}
function firstRule(t,from,to){/* carousel goes on the day of the first reel of the week */
  if(!t.withFirst||t.counter)return null;
  const live=f=>S.items.filter(i=>i.format===f&&i.date>=from&&i.date<=to&&i.status!=='idea').map(i=>i.date).sort();
  const anchor=live(t.withFirst)[0];const mine=live(t.format);const an=fmtName(t.withFirst),me=tgtName(t);
  if(!anchor)return {ok:false,text:`${me}: в день первого ${an}, но ${an} на этой неделе пока нет`};
  const dn=`${WD[wdIdx(parse(anchor))]} ${parse(anchor).getDate()}`;
  if(!mine.length)return {ok:false,text:`${me} нужна в ${dn}, вместе с первым ${an}`};
  return mine.includes(anchor)?{ok:true,text:`${me} в день первого ${an} (${dn}) ✓`}:{ok:false,text:`${me} стоит не в тот день: нужна в ${dn}, вместе с первым ${an}`};}
const platDot=p=>p?`<i class="pd" style="background:var(--${p==='instagram'?'ig':'ss'})"></i>`:'';
const shortN=n=>n.length>8?n.slice(0,7)+'.':n;
function dayGaps(ds){const p=settings().plan;if(!p.enabled)return [];const t=iso(today());const out=[];
  planTargets().filter(x=>x.period==='day'&&S.show[tgtPlat(x)]).forEach(x=>{
    if(x.counter){if(ds>t)return;const v=cntVal(x.counter,ds);out.push({label:`${shortN(tgtName(x))} ${v}/${x.min} +`,bad:v<x.min,cnt:x.counter,plat:tgtPlat(x)})}
    else{if(ds<t)return;const v=fmtCount(x.format,ds,ds);out.push({label:`${tgtName(x)} ${v}/${x.min}`,bad:v<x.min,plat:tgtPlat(x)})}});
  return out;}
function gapPill(g,ds){return g.cnt?`<button class="pill ${g.bad?'bad':'good'}" data-act="cnt" data-c="${esc(g.cnt)}" data-date="${ds}" data-d="1" title="Отметить ещё один">${platDot(g.plat)}${esc(g.label)}</button>`:`<span class="pill ${g.bad?'bad':'good'}">${platDot(g.plat)}${esc(g.label)}</span>`}
const cntQ={};
function bumpCounter(cid,ds,delta){const nv=Math.max(0,cntVal(cid,ds)+delta);S.cntLocal[ds+'|'+cid]=nv;render();
  cntQ[ds]=(cntQ[ds]||Promise.resolve()).then(async()=>{const d=S.daily.find(x=>x.id===ds);const counts=Object.assign({},(d&&d.counts)||{});
    Object.keys(S.cntLocal).forEach(k=>{const [kd,kc]=k.split('|');if(kd===ds)counts[kc]=S.cntLocal[k]});
    if(!await W(S.db.doc('daily/'+ds).set({counts,updatedAt:Date.now()}))){Object.keys(S.cntLocal).forEach(k=>{if(k.startsWith(ds+'|'))delete S.cntLocal[k]});render()}});}
function metricsDue(){const t=today(),st=settings();const mon=iso(mondayOf(t));const prev=iso(addDays(mondayOf(t),-7));
  const has=w=>S.metrics.some(m=>m.id===w);
  if(has(mon))return null;
  if(wdIdx(t)>=st.reminderDay)return mon;
  /* remind about last week only if tracking had started before it and last week was skipped */
  const last=S.metrics.map(m=>m.id).sort().pop();
  if(last&&last<prev)return prev;return null;}

/* ---------- render ---------- */
function render(){
  const a=document.activeElement;
  if(a&&a.closest&&a.closest('#content')&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.type!=='checkbox'){S.pending=true;return}
  if(document.querySelector('#modal .scrim')&&ED){S.pending=true;renderNav();return}
  S.pending=false;renderNav();
  const bar=document.getElementById('bar'),c=document.getElementById('content');
  if(!S.ok){bar.innerHTML='<h1>Контент-план</h1>';c.innerHTML=S.loaded?`<div class="banner warn">Не удалось загрузить данные. Проверьте, что у вашего Google-аккаунта есть доступ к таблице «Контент-план — данные», и обновите страницу.</div>`:'<div class="empty">Загрузка…</div>';return}
  const v=S.view;
  const views={planner:renderPlanner,ideas:renderIdeas,tags:renderTags,results:renderResults,lists:renderLists};
  views[v](bar,c);
  if(S.stale&&!S.loaded)c.insertAdjacentHTML('afterbegin','<div class="banner warn">Данные пока не загрузились. Проверьте соединение.</div>');}
function renderNav(){
  const due=S.ok&&metricsDue();const cnt=S.ok?openTodayCount():0;
  const items=[['planner','cal','Планировщик'],['ideas','idea','Идеи'],['tags','tag','Хэштеги'],['results','chart','Результаты',due?'<span class="dot" title="Пора внести результаты"></span>':''],['lists','tune','Справочники']];
  document.getElementById('nav').innerHTML=items.map(([k,i,n,x])=>`<button class="nav" data-act="go" data-v="${k}" aria-current="${S.view===k}">${ic(i)}${n}${x||''}</button>`).join('');}

function plannerBar(bar){
  const a=S.anchor;let title;
  if(S.mode==='week'){const s=mondayOf(a),e=addDays(s,6);
    title=s.getMonth()===e.getMonth()?`${s.getDate()}–${e.getDate()} ${MG[e.getMonth()]} ${e.getFullYear()}`:`${s.getDate()} ${MG[s.getMonth()]} – ${e.getDate()} ${MG[e.getMonth()]} ${e.getFullYear()}`;}
  else title=`${MN[a.getMonth()]} ${a.getFullYear()}`;
  const n=settings().plan;
  bar.innerHTML=`<button class="btn" data-act="today">Сегодня</button>
  <button class="ibtn" data-act="prev" aria-label="Назад">${ic('left')}</button><button class="ibtn" data-act="next" aria-label="Вперёд">${ic('right')}</button>
  <h1>Планировщик <span class="sub">${title}</span></h1><span class="grow"></span>
  <button class="chip" data-act="toggleplat" data-v="substack" aria-pressed="${S.show.substack}"><span class="sw" style="background:var(--ss)"></span>Substack</button>
  <button class="chip" data-act="toggleplat" data-v="instagram" aria-pressed="${S.show.instagram}"><span class="sw" style="background:var(--ig)"></span>Instagram</button>
  <button class="chip" data-act="togglenorms" aria-pressed="${n.enabled}" title="Показывать выполнение плана">План</button>
  <div class="seg"><button data-act="mode" data-v="week" aria-pressed="${S.mode==='week'}">Неделя</button><button data-act="mode" data-v="month" aria-pressed="${S.mode==='month'}">Месяц</button></div>`;}
function visibleItems(){return S.items.filter(i=>S.show[i.platform])}
const sortItems=(a,b)=>(a.time||'99').localeCompare(b.time||'99')||(a.createdAt||0)-(b.createdAt||0);
function cardHtml(i){const t=i.title||(i.text||'').split('\n')[0]||'Без темы';const r=rubName(i.rubricId);
  return `<div class="card ${i.platform==='instagram'?'instagram':'substack'} st-${esc(i.status)}" draggable="true" data-act="open" data-id="${esc(i.id)}" tabindex="0">
  <div class="meta">${esc(fmtName(i.format)||PLAT[i.platform])}<span class="sb">${i.status==='idea'?'идея'+(i.time?' · '+esc(i.time):''):i.status==='published'?'✓ '+esc(i.time||'вышло'):'⏱ '+esc(i.time||'в отложке')}</span></div>
  <div class="t">${esc(t)}</div>${r?`<div class="rb">${esc(r)}</div>`:''}${i.status==='idea'?`<button class="qa" data-act="setst" data-id="${esc(i.id)}" data-st="planned" title="Отправил в отложку: Запланировано" aria-label="Отметить как запланированное">⏱</button>`:i.status==='planned'?`<button class="qa" data-act="setst" data-id="${esc(i.id)}" data-st="published" title="Вышло: Опубликовано" aria-label="Отметить как опубликованное">✓</button>`:''}</div>`;}
const LEGEND=`<span class="legend"><span><b class="lg-idea"></b>идея</span><span><b class="lg-planned"></b>в отложке</span><span><b class="lg-published"></b>вышло</span></span>`;
function reminderBanner(){const w=metricsDue();if(!w)return '';
  return `<div class="banner"><span class="grow">Пора внести результаты за неделю с ${shortDate(w)}.</span><button class="btn primary sm" data-act="gores" data-w="${w}">Внести</button></div>`;}
function renderPlanner(bar,c){
  plannerBar(bar);const vis=visibleItems();const n=settings().plan;const t=iso(today());
  if(S.mode==='week'){
    const s=mondayOf(S.anchor);const days=[...Array(7)].map((_,k)=>addDays(s,k));const from=iso(days[0]),to=iso(days[6]);
    let strip='';
    if(n.enabled){const ps=[];
      /* weekly totals for every publication target; day targets count as min × 7; counters stay in the day headers */
      planTargets().filter(x=>!x.counter&&S.show[tgtPlat(x)]).forEach(x=>{const r=tgtCount(x,from,to);const goal=x.period==='day'?x.min*7:x.min;
        ps.push(`<button class="kpi" data-act="go" data-v="lists" title="Нормы — в «Справочниках»"><span class="l">${platDot(tgtPlat(x))}${esc(tgtName(x))} · за неделю</span><span class="v">${r}<small> / ${goal}</small></span><span class="s${r>=goal?' ok':''}">${r>=goal?'выполнено':'не хватает '+(goal-r)}</span></button>`)});
      strip=ps.join('');}
    strip=`<div class="tiles5">${strip}<div class="kpi legendk">${LEGEND}</div></div>`;
    c.innerHTML=reminderBanner()+strip+`<div class="week">${days.map((d,k)=>{const ds=iso(d);
      const its=vis.filter(i=>i.date===ds).sort(sortItems);const gaps=dayGaps(ds);
      return `<section class="day${ds<t?' past':''}" data-drop="${ds}">
        <div class="dayhead"><span class="wd">${WD[k]}</span><span class="dn${ds===t?' today':''}">${d.getDate()}</span><div class="gaps">${gaps.map(g=>gapPill(g,ds)).join('')}</div></div>
        <div class="daybody">${its.map(cardHtml).join('')}</div>
        <button class="addday" data-act="new" data-date="${ds}">+ Добавить</button></section>`}).join('')}</div>`;
  }else{
    const a=S.anchor;const first=new Date(a.getFullYear(),a.getMonth(),1);const s=mondayOf(first);
    let html=WD.map(w=>`<div class="mh">${w}</div>`).join('');
    for(let k=0;k<42;k++){const d=addDays(s,k);const ds=iso(d);const its=vis.filter(i=>i.date===ds).sort(sortItems);
      const gap=ds>=t&&dayGaps(ds).some(g=>g.bad&&!g.cnt);const shown=its.slice(0,4);
      html+=`<div class="mc${d.getMonth()!==a.getMonth()?' out':''}" data-act="new" data-date="${ds}" data-drop="${ds}">
        <div class="mtop"><button class="mn${ds===t?' today':''}" data-act="gotoweek" data-date="${ds}" aria-label="Неделя с ${d.getDate()} ${MG[d.getMonth()]}">${d.getDate()}</button>${gap?'<span class="gapdot" title="Ниже нормы"></span>':''}</div>
        ${shown.map(i=>`<div class="mi ${i.platform} st-${esc(i.status)}" draggable="true" data-act="open" data-id="${esc(i.id)}" title="${esc(fmtName(i.format))}: ${esc(i.title||'')}"><i></i>${esc((i.time?i.time+' ':'')+(i.title||fmtName(i.format)||'Без темы'))}</div>`).join('')}
        ${its.length>4?`<button class="more btn text sm" data-act="gotoweek" data-date="${ds}">ещё ${its.length-4}</button>`:''}</div>`;}
    c.innerHTML=reminderBanner()+`<div class="norms">${LEGEND}</div><div class="month">${html}</div>`;}
  wireDnD(c);}
function wireDnD(c){
  c.querySelectorAll('[draggable="true"]').forEach(el=>{
    el.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',el.dataset.id);e.dataTransfer.effectAllowed='move';el.classList.add('dragging')});
    el.addEventListener('dragend',()=>el.classList.remove('dragging'));});
  c.querySelectorAll('[data-drop]').forEach(z=>{
    z.addEventListener('dragover',e=>{if([...e.dataTransfer.types].includes('text/plain')){e.preventDefault();z.classList.add('over')}});
    z.addEventListener('dragleave',e=>{if(!z.contains(e.relatedTarget))z.classList.remove('over')});
    z.addEventListener('drop',async e=>{e.preventDefault();z.classList.remove('over');const id=e.dataTransfer.getData('text/plain');const it=S.items.find(x=>x.id===id);
      if(it&&it.date!==z.dataset.drop)await W(S.db.doc('items/'+id).update({date:z.dataset.drop,updatedAt:Date.now()}));});});}

function planSetupHtml(){

  /* settings */

/* ---------- Результаты: динамика по неделям ---------- */
const fmtN=v=>v==null?'—':Number(v).toLocaleString('ru-RU',{maximumFractionDigits:1});
const metPlat=m=>/^ig_/.test(m.id)||/^instagram/i.test(m.name)?'instagram':'substack';
const metPct=m=>/%/.test(m.name);
const metShort=m=>m.name.replace(/^(Substack|Instagram):\s*/i,'');
function resWeeks(){const ids=S.metrics.map(x=>x.id).filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x)).sort();if(!ids.length)return [];
  const out=[];for(let d=parse(ids[0]);iso(d)<=ids[ids.length-1];d=addDays(d,7))out.push(iso(d));return out;}
function metVal(w,id){const d=S.metrics.find(x=>x.id===w);const v=d&&d.values?d.values[id]:null;return typeof v==='number'?v:null}
function deltaHtml(cur,prev,pct,label){if(cur==null||prev==null)return `<span class="dl">${label}: нет данных</span>`;
  const d=cur-prev;const rel=!pct&&prev?d/prev*100:null;const cls=d>0?'up':d<0?'down':'';
  return `<span class="dl ${cls}">${d>0?'▲':d<0?'▼':'■'} ${d>0?'+':''}${fmtN(d)}${pct?' п.п.':''}${rel!=null&&isFinite(rel)?` (${rel>0?'+':''}${rel.toFixed(rel>-10&&rel<10?1:0)}%)`:''} <em>${label}</em></span>`;}
/* one line chart: single series, platform colour, gaps where a week was not entered */
function lineChart(weeks,vals,color,pct){const W=520,H=150,L=40,R=14,T=12,B=26;
  const nums=vals.filter(v=>v!=null);if(!nums.length)return '<div class="hint" style="padding:40px 0;text-align:center">Нет данных</div>';
  let mn=Math.min(...nums),mx=Math.max(...nums);if(mn===mx){mn-=1;mx+=1}const pad=(mx-mn)*.15;mn-=pad;mx+=pad;if(Math.min(...nums)>=0&&mn<0)mn=0;
  const X=i=>L+(weeks.length===1?(W-L-R)/2:i*(W-L-R)/(weeks.length-1)),Y=v=>T+(1-(v-mn)/(mx-mn))*(H-T-B);
  const rg=mx-mn,step0=rg/2,mag=Math.pow(10,Math.floor(Math.log10(step0))),step=[1,2,2.5,5,10].map(k=>k*mag).find(s=>s>=step0)||step0;
  mn=Math.floor(mn/step)*step;mx=Math.ceil(mx/step)*step;const ticks=[];for(let t=mn;t<=mx+step/1e6;t+=step)ticks.push(Math.round(t*1e6)/1e6);
  let segs=[],cur=[];vals.forEach((v,i)=>{if(v==null){if(cur.length)segs.push(cur);cur=[]}else cur.push([X(i),Y(v)])});if(cur.length)segs.push(cur);
  const last=vals.map((v,i)=>[v,i]).filter(x=>x[0]!=null).pop();
  const xl=weeks.length<=8?weeks.map((w,i)=>i):[0,Math.round((weeks.length-1)/2),weeks.length-1];
  return `<svg class="lc" viewBox="0 0 ${W} ${H}" role="img" aria-label="График по неделям">
    ${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}" class="gl"/><text x="${L-6}" y="${(Y(t)+3.5).toFixed(1)}" class="ax" text-anchor="end">${fmtN(Math.round(t*10)/10)}</text>`).join('')}
    ${xl.map(i=>`<text x="${X(i).toFixed(1)}" y="${H-6}" class="ax" text-anchor="middle">${shortDate(weeks[i]).replace(/ (\S{3})\S*/,' $1')}</text>`).join('')}
    ${segs.map(sg=>sg.length>1?`<polyline points="${sg.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`:'').join('')}
    ${vals.map((v,i)=>v==null?'':`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="4" fill="${color}" stroke="var(--bg)" stroke-width="2"/><circle class="hit" cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="12" data-tip="${esc('Неделя с '+shortDate(weeks[i])+': '+fmtN(v)+(pct?'%':''))}"/>`).join('')}
    ${last?`<text x="${Math.min(X(last[1]),W-R-2).toFixed(1)}" y="${(Y(last[0])-9).toFixed(1)}" class="lv" text-anchor="${last[1]===weeks.length-1?'end':'middle'}">${fmtN(last[0])}${pct?'%':''}</text>`:''}
  </svg>`;}
/* weekly change as bars around a zero baseline */
function barChart(labels,vals,color){const W=520,H=150,L=40,R=14,T=14,B=26;const nums=vals.filter(v=>v!=null);
  if(!nums.length)return '<div class="hint" style="padding:40px 0;text-align:center">Нужно хотя бы две внесённые недели подряд</div>';
  let mn=Math.min(0,...nums),mx=Math.max(0,...nums);if(mn===mx)mx=1;const Y=v=>T+(1-(v-mn)/(mx-mn))*(H-T-B);
  const n=labels.length,bw=Math.min(36,(W-L-R)/n*.6),X=i=>L+(i+.5)*(W-L-R)/n;
  return `<svg class="lc" viewBox="0 0 ${W} ${H}" role="img" aria-label="Изменение за неделю">
    <line x1="${L}" x2="${W-R}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}" class="gl0"/><text x="${L-6}" y="${(Y(0)+3.5).toFixed(1)}" class="ax" text-anchor="end">0</text>
    ${vals.map((v,i)=>{if(v==null)return `<text x="${X(i).toFixed(1)}" y="${(Y(0)-6).toFixed(1)}" class="ax" text-anchor="middle">нет</text>`;
      const y0=Y(0),y1=Y(v),top=Math.min(y0,y1),hh=Math.max(2,Math.abs(y1-y0));
      return `<rect x="${(X(i)-bw/2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${hh.toFixed(1)}" rx="4" fill="${color}" opacity="${v<0?.45:1}"/><text x="${X(i).toFixed(1)}" y="${(v>=0?top-5:top+hh+12).toFixed(1)}" class="lv" text-anchor="middle">${v>0?'+':''}${fmtN(v)}</text><rect class="hit" x="${(X(i)-bw/2-6).toFixed(1)}" y="${T}" width="${(bw+12).toFixed(1)}" height="${H-T-B}" fill="transparent" data-tip="${esc(labels[i]+': '+(v>0?'+':'')+fmtN(v))}"/>`}).join('')}
    ${labels.map((l,i)=>`<text x="${X(i).toFixed(1)}" y="${H-6}" class="ax" text-anchor="middle">${esc(l.split(' – ')[0])}</text>`).join('')}
  </svg>`;}
function renderResults(bar,c){
  const st=settings();const w=S.resWeek;const doc=S.metrics.find(m=>m.id===w);const vals=(doc&&doc.values)||{};
  bar.innerHTML=`<h1>Результаты</h1>`;
  const weeks=resWeeks();const s=parse(w),e=addDays(s,6);
  const entry=`<div class="panel"><h2>Внести неделю ${s.getDate()} ${MG[s.getMonth()]} – ${e.getDate()} ${MG[e.getMonth()]}</h2>
    <div class="lrow" style="margin-bottom:8px"><button class="btn sm" data-act="resprev">${ic('left')}Предыдущая</button><button class="btn sm" data-act="resnext">Следующая${ic('right')}</button><button class="btn sm text" data-act="rescur">Текущая</button></div>
    <div class="row">${st.metrics.map(m=>`<label class="field"><span>${platDot(metPlat(m))} ${esc(m.name)}</span><input class="inp" type="number" step="any" data-metric="${esc(m.id)}" value="${vals[m.id]!=null?esc(vals[m.id]):''}"></label>`).join('')}</div>
    <div class="lrow" style="margin-top:12px"><button class="btn primary" data-act="ressave">Сохранить неделю</button>${doc?'<span class="hint">Данные за эту неделю уже внесены, можно поправить.</span>':''}</div></div>`;
  if(!weeks.length){c.innerHTML=reminderBanner()+entry+'<div class="empty">Динамика появится после первой внесённой недели.</div>';return}
  const card=m=>{const pl=metPlat(m),col=pl==='instagram'?'var(--ig)':'var(--ss)',pct=metPct(m);
    const series=weeks.map(x=>metVal(x,m.id));const idx=series.map((v,i)=>v!=null?i:-1).filter(i=>i>=0);
    const li=idx[idx.length-1],pi=idx[idx.length-2],fi=idx[0];
    const cur=li!=null?series[li]:null,prev=pi!=null?series[pi]:null,first=fi!=null&&fi!==li?series[fi]:null;
    return `<div class="mcard"><div class="mhd">${platDot(pl)}<span class="n">${esc(metShort(m))}</span></div>
      <div class="mv">${fmtN(cur)}${pct&&cur!=null?'<small>%</small>':''}<span class="mw">${li!=null?'неделя с '+shortDate(weeks[li]):''}</span></div>
      <div class="mds">${deltaHtml(cur,prev,pct,pi!=null&&li-pi>1?`к ${shortDate(weeks[pi])}`:'за неделю')}${first!=null&&fi!==pi?deltaHtml(cur,first,pct,'с '+shortDate(weeks[fi])):''}</div>
      ${lineChart(weeks,series,col,pct)}</div>`};
  const groups=['substack','instagram'].map(pl=>{const ms=st.metrics.filter(m=>metPlat(m)===pl);return ms.length?`<h2 class="grp">${platDot(pl)} ${PLAT[pl]}</h2><div class="mgrid">${ms.map(card).join('')}</div>`:''}).join('');
  /* growth of followers between entered weeks */
  const growth=(id,pl)=>{const m=st.metrics.find(x=>x.id===id);if(!m)return '';const pts=weeks.map(x=>[x,metVal(x,id)]).filter(x=>x[1]!=null);
    const labels=[],vs=[];for(let i=1;i<pts.length;i++){labels.push(shortDate(pts[i][0]).replace(/ (\S{3})\S*/,' $1')+(Math.round((parse(pts[i][0])-parse(pts[i-1][0]))/6048e5)>1?' *':''));vs.push(pts[i][1]-pts[i-1][1])}
    return `<div class="mcard"><div class="mhd">${platDot(pl)}<span class="n">${esc(PLAT[pl])}: ${esc(metShort(m).toLowerCase())}</span></div>${barChart(labels,vs,pl==='instagram'?'var(--ig)':'var(--ss)')}</div>`};
  const gr=[growth('ss_free','substack'),growth('ss_followers','substack'),growth('ig_followers','instagram')].join('');
  const tbl=`<div class="panel scroll-x"><h2>Все недели</h2><table class="tbl"><thead><tr><th>Неделя</th>${st.metrics.map(m=>`<th>${esc(m.name)}</th>`).join('')}</tr></thead><tbody>
    ${weeks.slice().reverse().map((x,ri,arr)=>{const has=S.metrics.some(d=>d.id===x);return `<tr${has?'':' class="miss"'}><td>${shortDate(x)}</td>${st.metrics.map(m=>{const v=metVal(x,m.id);const pv=arr[ri+1]?metVal(arr[ri+1],m.id):null;const d=v!=null&&pv!=null?v-pv:null;
      return `<td>${v==null?(has?'—':'не внесено'):fmtN(v)}${d?`<small class="${d>0?'up':'down'}">${d>0?'+':''}${fmtN(d)}</small>`:''}</td>`}).join('')}</tr>`}).join('')}</tbody></table>
    <div class="hint" style="margin-top:8px">Пропущенные недели на графиках — разрыв линии. В приросте «*» — изменение сразу за несколько недель.</div></div>`;
  c.innerHTML=reminderBanner()+groups+(gr?`<h2 class="grp">Прирост подписчиков и фолловеров по неделям</h2><div class="mgrid">${gr}</div>`:'')+tbl+entry;
  wireTips(c);}
function wireTips(c){let tip=document.getElementById('ctip');if(!tip){tip=document.createElement('div');tip.id='ctip';tip.setAttribute('role','tooltip');document.body.appendChild(tip)}
  c.querySelectorAll('[data-tip]').forEach(el=>{el.addEventListener('mouseenter',()=>{tip.textContent=el.dataset.tip;tip.hidden=false;const r=el.getBoundingClientRect();
      tip.style.left=Math.min(window.innerWidth-tip.offsetWidth-8,Math.max(8,r.left+r.width/2-tip.offsetWidth/2))+'px';tip.style.top=(r.top-tip.offsetHeight-8)+'px'});
    el.addEventListener('mouseleave',()=>{tip.hidden=true})});}

  else if(el.dataset.norm){const n=st.norms;n[el.dataset.norm]=el.type==='checkbox'?el.checked:Math.max(0,Number(el.value)||0);await saveSettings({norms:n})}
  else if(el.dataset.tgt){const id=el.dataset.id,f=el.dataset.tgt;await savePlan(p=>{const x=p.targets.find(k=>k.id===id);if(!x)return;
      if(f==='key'){const [kind,v]=el.value.split(':');delete x.format;delete x.counter;delete x.withFirst;if(kind==='c'){x.counter=v;x.period='day'}else x.format=v}

  else if(el.dataset.plan==='enabled'){await savePlan(p=>{p.enabled=el.checked})}

const AUTH={token:'',user:null,users:null,usersLoading:false};
try{AUTH.token=localStorage.getItem('ua_tok')||''}catch(e){}
const saveTok=t=>{AUTH.token=t||'';try{t?localStorage.setItem('ua_tok',t):localStorage.removeItem('ua_tok')}catch(e){}};
const AUTH_FREE=['authState','authBootstrap','authLogin'];
const API_URL='https://script.google.com/macros/s/AKfycbyyVCr6r_-g410em43bvMfV98_oo5u-Hmhlc_DXU01G6fmGH_fzGigWk2GiLWXjO6VWNA/exec';
const errCode=m=>/auth_required/.test(m)?'auth':/too_large/.test(m)?'too_large':/not_in_media/.test(m)?'not_in_media':/admin_only/.test(m)?'denied':/permission|access|denied|authoriz|разреш|доступ/i.test(m)?'denied':'net';
function gcall(fn,...args){
  if(!AUTH_FREE.includes(fn))args=[AUTH.token].concat(args);
  const fail=m=>{const code=errCode(m);if(code==='auth'&&!AUTH_FREE.includes(fn))setTimeout(authLost,0);return Object.assign(new Error(m),{code})};
  if(window.google&&google.script&&google.script.run)return new Promise((res,rej)=>{
    google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(fail(String(e&&e.message||e))))[fn](...args)});
  /* страница вне Google (GitHub Pages): запрос без cookies Google, несколько аккаунтов не мешают */
  return fetch(API_URL,{method:'POST',credentials:'omit',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args})})
    .catch(()=>{throw Object.assign(new Error('network'),{code:'net'})})
    .then(r=>r.text()).then(t=>{let j;try{j=JSON.parse(t)}catch(e){throw Object.assign(new Error('bad_response'),{code:'net'})}
      if(!j.ok)throw fail(String(j.err||''));return j.r});}
const AUTH_ERR=m=>/auth_locked/.test(m)?'Слишком много неверных попыток. Попробуйте через 15 минут.':/bad_credentials/.test(m)?'Неверный логин или пароль.':/weak_password/.test(m)?'Пароль — минимум 8 символов.':/bad_login/.test(m)?'Логин: латиница, цифры, точка, дефис или подчёркивание, от 2 символов.':/already_initialized/.test(m)?'Владелец уже создан — войдите.':/cannot_delete_self/.test(m)?'Себя удалить нельзя.':'Не получилось. Проверьте соединение и повторите.';
function loginScreen(mode,msg){
  let el=document.getElementById('login');if(!el){el=document.createElement('div');el.id='login';document.body.appendChild(el)}
  const boot=mode==='bootstrap';
  el.innerHTML=`<form class="loginbox" autocomplete="on"><div class="brand"><b>U</b>Контент-план</div>
    <h2>${boot?'Создайте владельца':'Вход'}</h2>
    ${boot?'<p class="hint">Первый запуск. Этот логин будет главным: он сможет добавлять и удалять доступ для других.</p>':''}
    <label class="field"><span>Логин</span><input class="inp" name="username" id="lg_l" autocomplete="username" autocapitalize="off" spellcheck="false" required></label>
    ${boot?'<label class="field"><span>Имя (как показывать)</span><input class="inp" id="lg_n" placeholder="Данил"></label>':''}
    <label class="field"><span>Пароль</span><input class="inp" type="password" name="password" id="lg_p" autocomplete="${boot?'new-password':'current-password'}" required minlength="${boot?8:1}"></label>
    <div class="lerr" role="alert">${esc(msg||'')}</div>
    <button class="btn primary" type="submit">${boot?'Создать и войти':'Войти'}</button></form>`;
  el.hidden=false;document.body.classList.add('locked');
  setTimeout(()=>{const f=document.getElementById('lg_l');f&&f.focus()},30);
  el.querySelector('form').onsubmit=async e=>{e.preventDefault();const b=el.querySelector('button[type=submit]');b.disabled=true;b.textContent='Проверяю…';
    const l=document.getElementById('lg_l').value,pw=document.getElementById('lg_p').value;
    try{const r=JSON.parse(boot?await gcall('authBootstrap',l,(document.getElementById('lg_n')||{}).value||'',pw):await gcall('authLogin',l,pw));
      saveTok(r.token);AUTH.user={login:r.login,name:r.name,role:r.role};el.hidden=true;el.innerHTML='';document.body.classList.remove('locked');startApp();}
    catch(err){loginScreen(mode,AUTH_ERR(err.message))}};}
let authLostShown=false;
function authLost(){if(authLostShown)return;authLostShown=true;saveTok('');AUTH.user=null;loginScreen('login','Сессия закончилась — войдите снова.');}
async function authInit(){
  try{
    if(AUTH.token){try{AUTH.user=JSON.parse(await gcall('authMe'));return true}catch(e){if(e.code!=='auth')throw e;saveTok('')}}
    const st=JSON.parse(await gcall('authState'));loginScreen(st.hasUsers?'login':'bootstrap');return false;
  }catch(e){console.error(e);loginScreen('login','Не удалось связаться с сервером. Обновите страницу.');return false}}

  return `<div class="cols"><div class="panel"><h2>Доступ</h2>${list}

function makeDb(){
  const store={},cs={},ds={};let pending=0;
  const strip=d=>{const o=Object.assign({},d);delete o.id;return o};
  const snapOf=c=>({docs:(store[c]||[]).map(d=>({id:d.id,data:()=>strip(d)}))});
  const emit=c=>{(cs[c]||[]).forEach(f=>f(snapOf(c)));
    Object.keys(ds).forEach(k=>{const i=k.indexOf('/');if(k.slice(0,i)!==c)return;const d=(store[c]||[]).find(x=>x.id===k.slice(i+1));
      ds[k].forEach(f=>f({exists:!!d,data:()=>d?strip(d):undefined}))});};
  const clone=x=>x==null?x:JSON.parse(JSON.stringify(x));
  const local=(op,c,id,data)=>{const a=store[c]=store[c]||[];const i=a.findIndex(x=>x.id===id);
    if(op==='delete'){if(i>=0)a.splice(i,1)}
    else if(op==='update'){if(i>=0)a[i]=Object.assign({},a[i],data,{id})}
    else{const o=Object.assign({},data,{id});if(i>=0)a[i]=o;else a.push(o)}
    emit(c);};
  async function write(op,c,id,data){const before=clone(store[c]||[]);data=clone(data);local(op,c,id,data);pending++;
    try{await gcall('write',op,c,id,data)}catch(e){store[c]=before;emit(c);throw e}finally{pending--}}
  const ref=(c,id)=>({id,set:d=>write('set',c,id,d),update:d=>write('update',c,id,d),delete:()=>write('delete',c,id),
    onSnapshot:f=>{const k=c+'/'+id;(ds[k]=ds[k]||[]).push(f)}});
  return {
    collection:c=>({onSnapshot:f=>{(cs[c]=cs[c]||[]).push(f)},add:d=>write('set',c,uid(),d),doc:id=>ref(c,id||uid())}),
    doc:p=>{const i=p.indexOf('/');return ref(p.slice(0,i),p.slice(i+1))},
    async load(){const raw=JSON.parse(await gcall('loadAll'));if(pending)return raw.me;
      Object.keys(raw).forEach(k=>{if(k!=='me')store[k]=raw[k]});Object.keys(store).forEach(emit);return raw.me},
    busy:()=>pending>0};}

ACT.drivelink=async()=>{const el=document.getElementById('drivelink');if(!el||!ED)return;const v=el.value.trim();if(!v)return;
  const m=v.match(/\/d\/([\w-]{15,})/)||v.match(/[?&]id=([\w-]{15,})/)||v.match(/^([\w-]{15,})$/);
  if(!m){toast('Не похоже на ссылку на файл в Google Drive.');return}
  toast('Проверяю файл…');
  try{const r=await gcall('fileInfo',m[1]);if(!ED)return;el.value='';ED.draft.media.push({id:r.id,ct:r.contentType,name:r.name});syncFields();refreshMedia();toast('Файл добавлен')}
  catch(e){console.error(e);toast(e.code==='not_in_media'?'Сначала положите файл в папку «Медиа» на Drive, потом вставьте ссылку.':'Не удалось открыть файл: проверьте ссылку.')}};
render();
let appStarted=false;
(async()=>{if(await authInit())startApp()})();
async function startApp(){if(appStarted)return;appStarted=true;
  const db=makeDb();S.db=db;
  S.assets={
    upload:async f=>{const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=()=>rej(r.error);r.readAsDataURL(f)});
      return gcall('uploadFile',b64,f.name||'файл',f.type||'')},
    delete:id=>gcall('trashFile',id)};
  const timer=setTimeout(()=>{S.stale=true;render()},15000);
  const got=()=>{if(!S.loaded){S.loaded=true;clearTimeout(timer)}render()};
  const col=(name,key)=>db.collection(name).onSnapshot(s=>{S[key]=s.docs.map(d=>Object.assign({id:d.id},d.data()));got()});
  col('items','items');col('ideas','ideas');col('folders','folders');col('tags','tags');col('metrics','metrics');
  db.collection('daily').onSnapshot(s=>{S.daily=s.docs.map(d=>Object.assign({id:d.id},d.data()));
    Object.keys(S.cntLocal).forEach(k=>{const [kd,kc]=k.split('|');const d=S.daily.find(x=>x.id===kd);if(d&&d.counts&&d.counts[kc]===S.cntLocal[k])delete S.cntLocal[k]});got()});
  db.doc('settings/main').onSnapshot(s=>{S.settingsDoc=s.exists?s.data():null;render()});
  try{const me=await db.load();S.ok=true;if(me&&me.login)AUTH.user=me;
    const u=AUTH.user||{};
    document.getElementById('foot').innerHTML=`${esc(u.name||'')} · <button class="linkbtn" data-act="logout">Выйти</button>${u.role==='admin'?`<br><a href="${SHEET_URL}" target="_blank" rel="noopener">Таблица с данными</a> · <a href="${FOLDER_URL}" target="_blank" rel="noopener">Папка медиа</a>`:''}`;
    got();}
  catch(e){console.error(e);clearTimeout(timer);S.loaded=true;S.ok=false;render();return}
  /* other people's edits: refresh every 30 s while the tab is visible, and on return to the tab */
  const refresh=()=>{if(document.visibilityState==='visible'&&!db.busy())db.load().catch(e=>{if(e&&e.code==='auth')authLost()})};
  setInterval(refresh,30000);
  document.addEventListener('visibilitychange',refresh);
}
